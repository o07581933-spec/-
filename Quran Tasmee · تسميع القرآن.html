<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.ln.mhdr,.mflow .mhdr{justify-content:center;text-align:center;font-family:'Amiri Quran',serif;color:#6f5212;border:1.5px solid #b8903f;border-radius:8px;background:linear-gradient(90deg,transparent,rgba(201,161,74,.22),transparent);font-size:.82em;padding:.05em 0}
.ln.mbasm,.mflow .mbasm{justify-content:center;font-family:'Amiri Quran',serif;font-size:.9em;text-align:center}
.mflow{flex:1;overflow:auto;text-align:justify;text-align-last:center;line-height:2.05;direction:rtl;font-family:'Amiri Quran',serif}
.mw{cursor:pointer;border-radius:4px;transition:color .25s,background .25s}
.mw.c{color:#1e8a4a}.mw.x{color:#c62f24;background:rgba(198,47,36,.13)}.mw.r{color:#a87700;background:rgba(232,185,49,.2)}.mw.cur{box-shadow:0 3px 0 -1px #c9a14a}.mw.wsel{background:rgba(201,161,74,.38)}
.hidepend .mw.p{color:transparent}
.me{color:#8a6a22;cursor:pointer}
.mnav{direction:ltr}
.mbar{padding:10px;position:sticky;top:var(--hdr,62px);z-index:6}
@media (max-width:860px){.mbar{position:static}}
.flipov{position:absolute;inset:0;pointer-events:none;transform-origin:right center;backface-visibility:hidden;z-index:5}
.flipov::after{content:'';position:absolute;inset:0;background:linear-gradient(270deg,rgba(0,0,0,.35),transparent 40%);opacity:0;transition:opacity .6s}
.flipov.turnout{animation:turnout .65s cubic-bezier(.4,.1,.6,1) forwards}.flipov.turnout::after{opacity:1}
@keyframes turnout{0%{transform:rotateY(0)}100%{transform:rotateY(172deg);opacity:.15}}
.flipov.turnin{transform:rotateY(172deg);opacity:.2;transition:transform .62s cubic-bezier(.3,.1,.5,1),opacity .62s}.flipov.turnin.go{transform:rotateY(0);opacity:1}
@media (min-width:861px){.mpg{flex:0 0 auto;height:min(calc(100vh - var(--hdr,62px) - 175px),900px);width:auto;max-width:none}.stage{max-width:none}}
.item .num svg{width:24px;height:24px}
.cwcard{background:radial-gradient(circle at 50% 0,color-mix(in srgb,var(--gold) 14%,var(--surface)),var(--surface))}
.cwblank{display:inline-block;min-width:2.4em;padding:0 .3em;border-bottom:3px dashed var(--gold);color:var(--gold2);border-radius:6px;animation:pulse 1.6s infinite}
.cwblank.okw{animation:pop .4s;border-bottom-color:var(--green);color:var(--green);background:color-mix(in srgb,var(--green) 14%,transparent)}
.cwblank.badw{border-bottom-color:var(--green);color:var(--green)}
.cwopts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cwopt{font-family:var(--qfont);font-size:calc(var(--qsize)*.85);padding:10px 8px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface2);cursor:pointer;transition:transform .15s,background .3s,border-color .3s;direction:rtl}
.cwopt:hover:not([disabled]){border-color:var(--gold);transform:translateY(-2px)}
.cwopt.ok{background:color-mix(in srgb,var(--green) 30%,var(--surface2));border-color:var(--green);animation:pop .4s}
.cwopt.bad{background:color-mix(in srgb,var(--red) 28%,var(--surface2));border-color:var(--red);animation:shake .35s}
.cwopt.dim{opacity:.45}
</style>
</head>

const IDB={db:null,
 open(){return new Promise((res)=>{if(this.db)return res(this.db);try{const r=indexedDB.open('qt_cache',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>{this.db=r.result;res(this.db);};r.onerror=()=>res(null);}catch(e){res(null);}});},
 async get(k){const db=await this.open();if(!db)return null;return new Promise(res=>{try{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null);}catch(e){res(null);}});},
 async set(k,v){const db=await this.open();if(!db)return;return new Promise(res=>{try{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>res();}catch(e){res();}});},
 async clear(){const db=await this.open();if(!db)return;return new Promise(res=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').clear();tx.oncomplete=()=>res();tx.onerror=()=>res();});}

/* ===== Arabic normalization ===== */
const DIAC=/[ؐ-ًؚ-ٟۖ-ۭ࣓-ࣿـ]/g;
function normBase(s){return s.replace(/[ٱأإآ]/g,'ا').replace(/[ىی]/g,'ي').replace(/ة/g,'ه').replace(/ؤ/g,'و').replace(/ئ/g,'ي');}
function norm(s){return normBase(String(s).replace(DIAC,'').replace(/ٰ/g,'')).replace(/[^ء-ي]/g,'');}
function normVariants(tok){ // Uthmani spelling variants for matching
 const a=norm(tok);
 const b=normBase(tok.replace(/[وى]ٰ/g,'ا').replace(/ٰ/g,'ا').replace(DIAC,'')).replace(/[^ء-ي]/g,'');
 return a===b?[a]:[a,b];}
function lev(a,b){if(a===b)return 0;const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=new Array(n+1),c=new Array(n+1);for(let j=0;j<=n;j++)p[j]=j;
 for(let i=1;i<=m;i++){c[0]=i;for(let j=1;j<=n;j++){c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));}[p,c]=[c,p];}return p[n];}
function sim(a,b){if(!a||!b)return 0;if(a===b)return 1;return 1-lev(a,b)/Math.max(a.length,b.length);}
function simForms(n,forms){let m=0;for(const f of forms){const s=sim(n,f);if(s>m)m=s;
 // tolerate attached conjunction و/ف differences
 if(n.length>2&&(n[0]==='و'||n[0]==='ف')){const s2=sim(n.slice(1),f)-0.05;if(s2>m)m=s2;}
 if(f.length>2&&(f[0]==='و'||f[0]==='ف')){const s3=sim(n,f.slice(1))-0.05;if(s3>m)m=s3;}}return m;}

const BASM_N='بسماللهالرحمنالرحيم';
function splitBasmala(text,s,a){ // remove the basmala prefix the source attaches to ayah 1 (not Al-Fatiha / At-Tawbah)
 if(a!==1||s===1||s===9)return text;const tk=text.split(' ');if(tk.length>4&&norm(tk.slice(0,4).join(''))===BASM_N)return tk.slice(4).join(' ');return text;}
async function loadQuran(){
 const [ut,cl]=await Promise.all([getEdition('quran-uthmani'),getEdition('quran-simple-clean')]);
 Q.surahs=[];Q.ayahs=[];Q.bySurah=[];Q.byPage=[];Q.juzStart=[];
 ut.forEach((su,si)=>{const cs=cl[si];
  Q.surahs.push({n:su.number,ar:su.name.replace(/^سُورَةُ\s*/,''),en:su.englishName,enT:su.englishNameTranslation,type:su.revelationType,count:su.ayahs.length,start:Q.ayahs.length});
  Q.bySurah[su.number]=[];
  su.ayahs.forEach((ay,ai)=>{const text=splitBasmala(ay.text,su.number,ay.numberInSurah);const clean=splitBasmala(cs.ayahs[ai].text,su.number,ay.numberInSurah);
   const toks=text.split(' ').filter(Boolean);const ctoks=clean.split(' ').filter(Boolean);
   const sameCount=toks.length===ctoks.length;
   const words=toks.map((tk,i)=>{const forms=normVariants(tk);if(sameCount){const cf=norm(ctoks[i]);if(cf&&!forms.includes(cf))forms.push(cf);}return{d:tk,forms:forms.filter(Boolean),n:forms[0]};});
   const o={lw:words.filter(w=>w.forms.length),g:ay.number,s:su.number,a:ay.numberInSurah,text,clean,cleanN:clean.split(' ').map(norm).join(' '),juz:ay.juz,page:ay.page,sajda:!!ay.sajda,words,cmap:sameCount};
   Q.ayahs.push(o);Q.bySurah[su.number].push(o);(Q.byPage[ay.page]||(Q.byPage[ay.page]=[])).push(o);if(!Q.juzStart[ay.juz])Q.juzStart[ay.juz]=o;});});
 Q.ready=true;}

function searchQuran(q){const res={surahs:[],ayahs:[]};const raw=q.trim();if(!raw)return res;
 const qn=norm(raw.replace(/\s+/g,'|')).length?raw.split(/\s+/).map(norm).filter(Boolean):[];const lower=raw.toLowerCase();
 const nnum=+raw.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
 Q.surahs.forEach(s=>{if((nnum&&s.n===nnum)||(qn.length&&norm(s.ar).includes(qn.join('')))||s.en.toLowerCase().replace(/[^a-z]/g,'').includes(lower.replace(/[^a-z]/g,''))&&lower.replace(/[^a-z]/g,'').length>1)res.surahs.push(s);});
 if(!qn.length)return res;const phrase=qn.join(' ');
 for(const x of Q.ayahs){const hay=x.cleanN;if(!hay.includes(phrase))continue;const cw=hay.split(' ');const hits=[];
  for(let i=0;i+qn.length<=cw.length;i++){let ok=true;for(let j=0;j<qn.length;j++){const w=cw[i+j],q2=qn[j];if(qn.length===1){if(!w.includes(q2)){ok=false;break;}}else if(j===0?!w.endsWith(q2):j===qn.length-1?!w.startsWith(q2):w!==q2){ok=false;break;}}if(ok)for(let j=0;j<qn.length;j++)hits.push(i+j);}
  if(!hits.length)continue;res.ayahs.push({x,hits:[...new Set(hits)],count:Math.max(1,hits.length/qn.length|0)});}
 return res;}
function hlAyah(x,hits){const set=new Set(hits);if(x.cmap)return x.text.split(' ').filter(Boolean).map((w,i)=>set.has(i)?`<mark>${esc(w)}</mark>`:esc(w)).join(' ');

class ServerRec{ // sends ~5 s audio chunks to the user's own Quran-specific endpoint, expects {"text": "..."}

 isAyahStart(j){for(let i=j-1;i>=0&&this.w[i].ai===this.w[j].ai;i--)if(this.w[i].forms.length)return false;return true;}
 // a word heard that belongs BEFORE the current position = the reciter is repeating (never a mistake)
 markRep(k,n){this.rep[k]++;this.repeats++;this.dirty.add(k);
  if((this.st[k]==='x'||this.st[k]==='r'||this.st[k]==='s'||this.st[k]==='o')&&simForms(n,this.w[k].forms)>=0.85){this.st[k]='c';this.fixed[k]=1;}}

 findBack(n){for(let j=this.pos-1,c=0;j>=0&&c<80;j--){if(!this.w[j].forms.length)continue;c++;if(simForms(n,this.w[j].forms)>=0.85&&(c<=4||this.isAyahStart(j)))return j;}return -1;}

  for(let j=this.pos-1,c=0;j>=0&&c<4;j--){if(!this.w[j].forms.length)continue;c++;if(this.st[j]==='s'&&simForms(n,this.w[j].forms)>=0.8){this.st[j]='o';this.heard[j]=raw;this.dirty.add(j);return 'o';}}

function loadMorph(){if(MORPH)return Promise.resolve(MORPH);if(MORPH_P)return MORPH_P;
 MORPH_P=(async()=>{let txt=await IDB.get('morph_txt');if(!txt){const r=await fetch(MORPH_URL);if(!r.ok)throw new Error('HTTP '+r.status);txt=await r.text();if(txt.length<1e6)throw new Error('short');await IDB.set('morph_txt',txt);}
  const byLoc={},byRoot={},byLemma={};
  for(const line of txt.split('\n')){if(line[0]!=='(')continue;const [loc,form,tag,feat]=line.split('\t');const m=loc.match(/\((\d+):(\d+):(\d+):(\d+)\)/);if(!m)continue;const k=m[1]+':'+m[2]+':'+m[3];
   const f=(feat||'').trim().split('|');let root=null,lem=null;f.forEach(x=>{if(x.startsWith('ROOT:'))root=x.slice(5);if(x.startsWith('LEM:'))lem=x.slice(4);});
   (byLoc[k]||(byLoc[k]=[])).push({form,tag,f,root,lem});
   if(root){const l=byRoot[root]||(byRoot[root]=[]);if(l[l.length-1]!==k)l.push(k);}if(lem){const l=byLemma[lem]||(byLemma[lem]=[]);if(l[l.length-1]!==k)l.push(k);}}
  MORPH={byLoc,byRoot,byLemma};return MORPH;})().catch(e=>{MORPH_ERR=true;MORPH_P=null;throw e;});return MORPH_P;}
const L2=(pair)=>S.lang==='ar'?pair[0]:pair[1];
function featLabels(seg){const out=[];for(const x of seg.f){if(x==='STEM'||x==='PREFIX'||x==='SUFFIX'||x.startsWith('POS:')||x.startsWith('LEM:')||x.startsWith('ROOT:'))continue;
  if(FEATS[x]&&!(x==='ACC'&&seg.tag==='ACC')){out.push(L2(FEATS[x]));continue;}
  let m=x.match(/^\(([IVX]+)\)$/);if(m){out.push((S.lang==='ar'?'الوزن ':'Form ')+m[1]);continue;}
  m=x.match(/^([123])([MF]?)([SDP]?)$/);if(m){out.push([L2(PERSON[m[1]]),m[2]&&m[3]?L2(FEATS[m[2]+m[3]]):m[2]?L2(FEATS[m[2]]):m[3]?L2(FEATS[m[3]]):''].filter(Boolean).join(' '));continue;}
  if(x==='PCPL'||x==='ACT'||x==='PASS'){continue;}
  if(/^[a-z]/.test(x)||x.includes('+'))continue; // prefix/suffix spellings, e.g. bi+, Al+
  out.push(x);}
 if(seg.f.includes('ACT')&&seg.f.includes('PCPL'))out.push(S.lang==='ar'?'اسم فاعل':'Active participle');
 else if(seg.f.includes('PASS')&&seg.f.includes('PCPL'))out.push(S.lang==='ar'?'اسم مفعول':'Passive participle');
 else if(seg.f.includes('PASS'))out.push(L2(FEATS.PASS));

const EASY=[1,36,55,56,67,...Array.from({length:37},(_,i)=>78+i)];
const MED=[...new Set([2,3,12,18,19,36,55,56,67,...Q_JUZ_SURAHS()])];
function Q_JUZ_SURAHS(){const o=[];for(let s=46;s<=114;s++)o.push(s);return o;}
function quizPool(level){return level==='easy'?EASY:level==='medium'?MED:Array.from({length:114},(_,i)=>i+1);}
function makeQuestion(level,rnd=Math.random){const pool=quizPool(level);let x=null,guard=0;while(!x&&guard++<200){const s=pool[Math.floor(rnd()*pool.length)];const list=Q.bySurah[s];const c=list[Math.floor(rnd()*list.length)];if(c.words.length>=4)x=c;}
 const opts=new Set([x.s]);while(opts.size<4){opts.add(pool[Math.floor(rnd()*pool.length)]);}const arr=[...opts];for(let i=arr.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return{x,opts:arr,level};}

 <table><tr><th></th><th>EveryAyah (${t('perAyah')})</th><th>MP3Quran (${t('fullSurah')})</th></tr>${RECITERS.map(r=>{const s=S.recStatus[r.id]||{};const b=v=>v===true?`<span class="badge ok">${t('ok')}</span>`:v===false?`<span class="badge no">${t('fail')}</span>`:`<span class="badge">${t('unknown')}</span>`;
  return `<tr><td>${esc(rName(r))}</td><td>${r.ea?b(s.ayah):'—'}</td><td>${r.surah?b(s.surah):MQ_LOADED?'—':b(undefined)}</td></tr>`;}).join('')}</table></div>`;
 $('#ck',el).onclick=()=>{$('#ck',el).disabled=true;probeAll(true,()=>{}).then(draw);};};
 loadMP3Quran().then(draw);draw();};

/* ===== boot ===== */
async function boot(){loadState();renderShell();render();
 try{await loadQuran();}catch(e){console.error(e);$('#main').innerHTML=`<div class="loading"><div><p class="banner err">${t('loadFail')}</p><button class="btn pri" id="rt">${t('retry')}</button></div></div>`;$('#rt').onclick=()=>{render();boot();};return;}
 render();setTimeout(()=>probeAll(false,()=>{}),4000);
 setInterval(()=>{if(!S.notify.on||!('Notification' in window)||Notification.permission!=='granted')return;const d=dayRec();if(d.pages>=S.goalPages)return;const last=S.notify.last||0;if(Date.now()-last<S.notify.min*60000)return;S.notify.last=Date.now();save();try{new Notification(t('notifTitle'),{body:t('notifBody',{n:num(d.pages),g:num(S.goalPages)})});}catch(e){}toast(t('notifBody',{n:num(d.pages),g:num(S.goalPages)}));},60000);}
boot();

</script>
</body>
